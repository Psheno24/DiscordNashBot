# Автодеплой на VPS после пуша в main.
# Нужны secrets репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      — IP или hostname VPS
#   DEPLOY_USER      — SSH-пользователь (часто root)
#   DEPLOY_SSH_KEY   — приватный ключ (весь PEM, включая BEGIN/END)
# Опционально:
#   DEPLOY_PORT      — порт SSH (по умолчанию 22)
#   DEPLOY_PATH      — каталог репо (по умолчанию /opt/discord-nash-bot/DiscordNashBot)
#
# На сервере один раз: ключ в authorized_keys, git remote origin, unit discord-nash-bot.
# Деплой = тот же bash update.sh (pull + npm ci + build + systemctl restart).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          [ -n "$HOST" ] || { echo "::error::Нет secret DEPLOY_HOST"; missing=1; }
          [ -n "$USER" ] || { echo "::error::Нет secret DEPLOY_USER"; missing=1; }
          [ -n "$KEY" ] || { echo "::error::Нет secret DEPLOY_SSH_KEY"; missing=1; }
          exit "$missing"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            ROOT="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$ROOT" ]; then
              ROOT="/opt/discord-nash-bot/DiscordNashBot"
            fi
            cd "$ROOT"
            bash update.sh
